openapi: 3.1.0
info:
  title: MikCasual API
  description: 公共接口无需认证，允许任意来源跨域读取。
  version: 1.0.0

servers:
  - url: https://data.mcmik.top/api
    description: 公共实例
  - url: /api
    description: 本地开发

security: []

paths:
  /players:
    get:
      summary: 获取在线玩家
      description: 上游不可用时优先使用缓存的在线快照，无可用快照时通过第三方服务查询在线人数。
      operationId: getPlayers
      responses:
        "200":
          description: 在线状态快照
          headers:
            X-Proxy-Cache:
              $ref: "#/components/headers/X-Proxy-Cache"
            X-Proxy-Source:
              $ref: "#/components/headers/X-Proxy-Source"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerOnlinePayload"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /buildings:
    get:
      summary: 获取建筑列表
      description: 按建造日期从新到旧返回匹配的建筑。
      operationId: getBuildings
      parameters:
        - name: tag
          in: query
          description: 精确匹配中文或英文标签。
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [original, derivative, replica]
        - name: builder
          in: query
          description: 精确匹配建造者名称或 UUID。
          schema:
            type: string
        - name: locale
          in: query
          description: >-
            省略或为空时，返回按语言代码索引的文本对象。
            指定 `zh-CN` 选择中文，其他非空值选择英文。
            单语响应中的 `name`、`description`、`tags` 元素和 `source.notes` 为字符串。
            标签或来源备注缺少指定语言的文本时，使用已有的另一种语言。
          schema:
            type: string
        - name: limit
          in: query
          description: >-
            筛选后的返回上限。省略时返回全部匹配项。
            指定时，响应中的 `total` 为应用此上限前的匹配总数。
            使用十进制整数，允许首尾空白和前导零。
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 2
      responses:
        "200":
          description: 匹配的建筑
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingCatalog"
        "400":
          description: '`limit` 为空、重复、格式无效或超出取值范围。'
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    const: invalid_limit
        "503":
          $ref: "#/components/responses/BuildingDataUnavailable"

  /buildings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/BuildingId"
    get:
      summary: 获取建筑详情
      operationId: getBuilding
      responses:
        "200":
          description: 建筑详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingDetail"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/BuildingDataUnavailable"

  /sponsors:
    get:
      summary: 获取赞助名单
      description: |
        只列出有可用实付订单的玩家，每个 Minecraft UUID 一条记录。
        只有 `X-Sponsor-Data` 为 `complete` 的响应会写入 30 秒边缘缓存。
      operationId: getSponsors
      responses:
        "200":
          description: 赞助名单按每位玩家最新一笔订单的付款时间从新到旧排列。付款时间相同时按 UUID 升序排列。
          headers:
            X-Sponsor-Data:
              description: |
                表示订单数据的完整性和新鲜度。

                - `complete`：订单数据已确认完整，且仍在刷新周期内。
                - `stale`：返回已超过刷新周期的完整订单快照。
                - `partial`：无法确认订单数据完整。返回当前可用的记录，结果可能为空。
              schema:
                type: string
                enum: [complete, stale, partial]
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sponsor"
        "503":
          description: 赞助服务暂时无法返回名单。
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    const: sponsor_data_unavailable

  /bans:
    get:
      summary: 获取当前封禁名单
      operationId: getBans
      responses:
        "200":
          description: 封禁记录
          headers:
            X-Proxy-Cache:
              $ref: "#/components/headers/X-Proxy-Cache"
            X-Proxy-Source:
              $ref: "#/components/headers/X-Proxy-Source"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BanItem"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /announcements:
    get:
      summary: 获取服务器公告
      operationId: getAnnouncements
      responses:
        "200":
          description: 公告记录
          headers:
            X-Proxy-Cache:
              $ref: "#/components/headers/X-Proxy-Cache"
            X-Proxy-Source:
              $ref: "#/components/headers/X-Proxy-Source"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnnouncementItem"
        "502":
          $ref: "#/components/responses/UpstreamError"

components:
  headers:
    X-Proxy-Cache:
      description: '`HIT` 为命中新鲜缓存，`MISS` 为重新获取的数据，`STALE` 为已到刷新时间的缓存。'
      schema:
        type: string
        enum: [MISS, HIT, STALE]
    X-Proxy-Source:
      description: '`UPSTREAM` 为 Minecraft 服务器数据，`FALLBACK` 为第三方查询结果。'
      schema:
        type: string
        enum: [UPSTREAM, FALLBACK]
  responses:
    BuildingDataUnavailable:
      description: 建筑数据暂时不可用。
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                const: building_data_unavailable
    Error:
      description: 未找到建筑。
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
    UpstreamError:
      description: 上游不可用，代理无法提供数据。
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string

  schemas:
    PlayerOnlinePayload:
      type: object
      required: [online, peak_online, players]
      example:
        online: 1
        peak_online: 8
        players:
          - uuid: 00000000-0000-0000-0000-000000000000
            name: PlayerName
            joined_at: "2026-06-27T12:34:56Z"
      properties:
        online:
          type: integer
          description: 当前在线人数。第三方服务报告服务器离线时为 `-1`。
        peak_online:
          type: integer
          description: 历史最高在线人数。使用第三方查询时为 `-1`。
        players:
          type: array
          description: 顺序未定义。使用第三方查询时为空数组。
          items:
            $ref: "#/components/schemas/OnlinePlayer"

    OnlinePlayer:
      type: object
      required: [name, uuid, joined_at]
      properties:
        name:
          type: string
        uuid:
          type: string
          format: uuid
        joined_at:
          type: string
          format: date-time
          description: 本次登录时间。

    BuildingFields:
      type: object
      required: [id, coordinates, builders, buildType, images, buildDate]
      properties:
        id:
          $ref: "#/components/schemas/BuildingId"
          readOnly: true
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        builders:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/Builder"
        buildType:
          type: string
          enum: [original, derivative, replica]
        images:
          type: array
          maxItems: 15
          description: >-
            按展示顺序排列的 WebP 原图文件名，可为空数组。第一张图为封面。
            原图地址为 `{imageBaseUrl}/buildings/{id}/{filename}`。
          items:
            type: string
            pattern: '^[0-9a-f]{64}\.webp$'
        buildDate:
          type: string
          format: date
          description: 建造日期（YYYY-MM-DD）。

    Building:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/BuildingFields"
        - type: object
          required: [name, description]
          properties:
            name:
              $ref: "#/components/schemas/LocalizedText"
            description:
              $ref: "#/components/schemas/LocalizedText"
            tags:
              type: array
              maxItems: 20
              items:
                $ref: "#/components/schemas/LocalizedText"
            source:
              $ref: "#/components/schemas/BuildingSource"

    BuildingId:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^[0-9a-f]{32}$'
      description: 服务端分配的固定小写十六进制标识。
      example: b40cfbaf9cd674ce203b81e7a8f690d2

    LocalizedBuilding:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/BuildingFields"
        - type: object
          required: [name, description]
          properties:
            name:
              type: string
            description:
              type: string
            tags:
              type: array
              items:
                type: string
            source:
              allOf:
                - $ref: "#/components/schemas/BuildingSourceFields"
                - properties:
                    notes:
                      type: string

    BuildingImageBaseUrl:
      type: [string, 'null']
      format: uri
      description: 图片的 HTTPS 基址，可包含路径且没有尾部斜杠。未配置基址且没有图片时为 null。

    BuildingCatalog:
      type: object
      required: [imageBaseUrl, buildings]
      properties:
        imageBaseUrl:
          $ref: "#/components/schemas/BuildingImageBaseUrl"
        total:
          type: integer
          minimum: 0
          description: 应用筛选条件后、截取建筑列表前的匹配总数。仅在请求指定 limit 时返回。
        buildings:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/Building"
            - type: array
              items:
                $ref: "#/components/schemas/LocalizedBuilding"

    BuildingDetail:
      type: object
      required: [imageBaseUrl, building]
      properties:
        imageBaseUrl:
          $ref: "#/components/schemas/BuildingImageBaseUrl"
        building:
          $ref: "#/components/schemas/Building"

    LocalizedText:
      type: object
      additionalProperties:
        type: string
      description: 键为语言代码，值为对应语言的文本。
      example:
        zh-CN: 示例文本
        en: Example text

    Coordinates:
      type: object
      additionalProperties: false
      required: [world, x, y, z]
      properties:
        world:
          type: string
          minLength: 1
          maxLength: 128
          example: world
        x:
          type: number
        y:
          type: number
        z:
          type: number
      description: Minecraft 世界坐标。

    Builder:
      type: object
      required: [name, uuid, weight]
      properties:
        name:
          type: string
        uuid:
          type: string
          format: uuid
        weight:
          type: number
          minimum: 0
          description: 用于计算该建造者的贡献比例。

    BuildingSourceFields:
      type: object
      minProperties: 1
      description: 建筑有来源信息时才返回该字段。
      properties:
        originalAuthor:
          type: string
        originalLink:
          type: string
          format: uri

    BuildingSource:
      allOf:
        - $ref: "#/components/schemas/BuildingSourceFields"
        - properties:
            notes:
              $ref: "#/components/schemas/LocalizedText"

    BanItem:
      type: object
      required:
        - playerName
        - playerUuid
        - reason
        - bannedBy
        - bannedAt
        - expiresAt
        - isPermanent
      properties:
        playerName:
          type: string
        playerUuid:
          type: string
          format: uuid
        reason:
          type: string
        bannedBy:
          type: string
        bannedAt:
          type: string
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
        isPermanent:
          type: boolean

    AnnouncementItem:
      type: object
      required: [content, timestamp]
      properties:
        content:
          type: string
        timestamp:
          type: string
          format: date-time

    Sponsor:
      type: object
      required: [uuid, name, orders]
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
          description: 依次使用手动设置的名称、赞助平台昵称或 Minecraft UUID。
        totalAmount:
          type: string
          description: 累计实付金额，单位为元，保留两位小数。无法确认该玩家的订单历史完整时省略。
        orders:
          type: array
          minItems: 1
          description: 可用的实付订单，按付款时间从新到旧排列。
          items:
            $ref: "#/components/schemas/SponsorOrder"

    SponsorOrder:
      type: object
      required: [amount, at]
      properties:
        amount:
          type: string
          description: 实付金额，单位为元，保留两位小数。
        at:
          type: string
          format: date-time
          description: 付款时间（UTC，以 `Z` 结尾）。
          example: '2026-11-22T01:12:23.000Z'
        message:
          type: string
          description: 公开赞助留言。无留言时省略。
